spring.application.name=greenmove
server.port=8080

# H2 en memoire : la base disparait a l'arret. Console sur http://localhost:8080/h2-console (JDBC URL ci-dessous)
# Une seule base pour le deployable, mais chaque hexagone a ses tables : aucune relation JPA entre location et facture.
spring.datasource.url=jdbc:h2:mem:greenmove;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
